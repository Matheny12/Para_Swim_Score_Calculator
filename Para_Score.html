<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Swim Score Calculator</title>
    <style>
        :root {
            --primary-color: #0066cc;
            --primary-hover: #004fb3;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #cccccc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 450px;
        }

        h1 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 25px;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        select, input {
            width: 100%;
            padding: 10px 12px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            background-color: #fff;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .result-container {
            margin-top: 25px;
            padding: 15px;
            background-color: #eef4fb;
            border-left: 4px solid var(--primary-color);
            border-radius: 4px;
            text-align: center;
        }

        .result-container h3 {
            margin: 0;
            font-size: 18px;
            color: #1a365d;
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <h1>Para Swim Score Calculator</h1>
        
        <div class="form-group">
            <label for="Gender">Gender</label>
            <select id="Gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </div>

        <div class="form-group">
            <label for="Classification">Classification</label>
            <select id="Classification">
                <option value="S1">S1</option>
                <option value="S2">S2</option>
                <option value="S3">S3</option>
                <option value="S4">S4</option>
                <option value="S5">S5</option>
                <option value="S6">S6</option>
                <option value="S7">S7</option>
                <option value="S8">S8</option>
                <option value="S9">S9</option>
                <option value="S10">S10</option>
                <option value="S11">S11</option>
                <option value="S12">S12</option>
                <option value="S13">S13</option>
                <option value="S14">S14</option>
                <option value="SB1">SB1</option>
                <option value="SB2">SB2</option>
                <option value="SB3">SB3</option>
                <option value="SB4">SB4</option>
                <option value="SB5">SB5</option>
                <option value="SB6">SB6</option>
                <option value="SB7">SB7</option>
                <option value="SB8">SB8</option>
                <option value="SB9">SB9</option>
                <option value="SB11">SB11</option>
                <option value="SB12">SB12</option>
                <option value="SB13">SB13</option>
                <option value="SB14">SB14</option>
                <option value="SM1">SM1</option>
                <option value="SM2">SM2</option>
                <option value="SM3">SM3</option>
                <option value="SM4">SM4</option>
                <option value="SM5">SM5</option>
                <option value="SM6">SM6</option>
                <option value="SM7">SM7</option>
                <option value="SM8">SM8</option>
                <option value="SM9">SM9</option>
                <option value="SM10">SM10</option>
                <option value="SM11">SM11</option>
                <option value="SM12">SM12</option>
                <option value="SM13">SM13</option>
                <option value="SM14">SM14</option>
            </select>
        </div>

        <div class="form-group">
            <label for="Event">Event</label>
            <select id="Event">
                <option value="1">50 M Freestyle</option>
                <option value="2">100 M Freestyle</option>
                <option value="3">200 M Freestyle</option>
                <option value="4">400 M Freestyle</option>
                <option value="5">800 M Freestyle</option>
                <option value="6">1500 M Freestyle</option>
                <option value="7">50 M Backstroke</option>
                <option value="8">100 M Backstroke</option>
                <option value="9">200 M Backstroke</option>
                <option value="10">50 M Breaststroke</option>
                <option value="11">100 M Breaststroke</option>
                <option value="12">200 M Breaststroke</option>
                <option value="13">50 M Butterfly</option>
                <option value="14">100 M Butterfly</option>
                <option value="15">200 M Butterfly</option>
                <option value="16">150 M I.M.</option>
                <option value="17">200 M I.M.</option>
                <option value="18">400 M I.M.</option>
            </select>
        </div>

        <div class="form-group">
            <label for="Time">Time (In Seconds)</label>
            <input type="number" id="Time" step="0.01" placeholder="e.g. 58.45">
        </div>

        <button onclick="onCalculateClicked()">Calculate Score</button>

        <div class="result-container">
            <h3 id="ResultDisplay">Result: --</h3>
        </div>
    </div>

    <script src="Para_score.js"></script>
    <script>
        function onCalculateClicked() {
            const gender = document.getElementById("Gender").value;
            const classification = document.getElementById("Classification").value;
            const eventId = parseInt(document.getElementById("Event").value);
            const timeVal = parseFloat(document.getElementById("Time").value);

            if (isNaN(timeVal) || timeVal <= 0) {
                alert("Please enter a valid time in seconds.");
                return;
            }

            try {
                const score = Module.ccall(
                    'calculateScore',
                    'number',
                    ['string', 'string', 'number', 'number'],
                    [gender, classification, eventId, timeVal]
                );

                if (score < 0) {
                    document.getElementById("ResultDisplay").innerText = "Result: Invalid event or class combination.";
                } else {
                    document.getElementById("ResultDisplay").innerText = "Result: " + score.toFixed(2);
                }
            } catch (err) {
                console.error("Calculation error:", err);
            }
        }
    </script>
</body>
</html>
